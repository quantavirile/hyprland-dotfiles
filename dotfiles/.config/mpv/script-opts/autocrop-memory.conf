# autocrop-memory: persist manual autocrop (SHIFT+C) per file.
# Companion to autocrop.lua - no changes to autocrop.lua needed.

# JSON database path (expanded with mpv expand-path, ~~ = ~/.config/mpv)
memory_path=~~/crop-memory.json

# Show OSD message when a saved crop is restored
osd_messages=yes

# Confirm delay in seconds after file-loaded if start-file apply missed.
# start-file applies synchronously before the first frame; this is only a
# fallback re-assert, so keep it tiny to avoid a bars flash.
restore_delay=0.02
