# =============================================================================
# mpv.conf - mpv Configuration
# =============================================================================

# -----------------------------------------------------------------------------
# HARDWARE ACCELERATION
# -----------------------------------------------------------------------------
# GPU-next video output driver (higher quality rendering, blur support)
vo=gpu-next
# VAAPI hardware decoding (vaapi-copy copies decoded frame to GPU memory which
# leads to smooth crops when script-opts-append=autocrop-auto=no is set to yes,
# but is CPU intensive)
hwdec=vaapi

# -----------------------------------------------------------------------------
# OSD
# -----------------------------------------------------------------------------
# Load custom theme for mpv OSD and controls
include=~/.config/mpv/themes/matugen.conf
# uosc provides seeking & volume indicators
# (via flash-timeline and flash-volume commands)
# if you decide to use them, you don't need osd-bar
osd-bar=no
# Disable built-in on-screen controller (uosc handles this)
osc=no
# OSD font face
osd-font="Inter Regular"
# OSD font size
osd-font-size=24

# -----------------------------------------------------------------------------
# WINDOW
# -----------------------------------------------------------------------------
# uosc will draw its own window controls and border if you disable window border
border=no
# Don't allow new windows to be larger than the screen
autofit-larger=100%x100%
# Disable indicators when nothing is playing
script-opts-append=uosc-disable_elements=idle_indicator
# Disable automatic cropping
script-opts-append=autocrop-auto=no 

# -----------------------------------------------------------------------------
# WATCH LATER
# -----------------------------------------------------------------------------
# Always save the current playback position on quit
save-position-on-quit=yes

# -----------------------------------------------------------------------------
# PROGRAM BEHAVIOR
# -----------------------------------------------------------------------------
# IPC socket for external commands (used by matugen to reload theme)
input-ipc-server=/tmp/mpv-socket
# Keep mpv open after playback ends (don't close on EOF)
keep-open=yes
# Reset these states when switching to a new file
reset-on-next-file=pause

# -----------------------------------------------------------------------------
# VIDEO FORMAT/QUALITY
# -----------------------------------------------------------------------------
# yt-dlp format selection: 480p, exclude AV1 (no hardware decode support)
ytdl-format=bv[height<=?480][vcodec!*=av01]+ba

# -----------------------------------------------------------------------------
# GPU RENDERER && MISCELLANEOUS
# -----------------------------------------------------------------------------
# Reduce stuttering caused by mismatches in the video fps
# and display refresh rate (also known as judder).
#video-sync=display-resample
#interpolation=yes

# -----------------------------------------------------------------------------
# SCREENSHOT
# -----------------------------------------------------------------------------
# Screenshot filename pattern (date and time based)
screenshot-template="screenshot_%ty%td%tm_%tH%tM%tS_mpv"
# Screenshot save location
screenshot-directory=~/Pictures/Screenshots/

# -----------------------------------------------------------------------------
# PROFILES
# -----------------------------------------------------------------------------
# Auto-loop tracks 60 seconds or shorter
[autoloop]
profile-cond=duration <= 60
profile-restore=copy-equal
loop-file=inf
