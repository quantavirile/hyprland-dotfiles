# -----------------------------------------------------
# Window Rules
# -----------------------------------------------------

# Pavucontrol
windowrule {
    name = pavucontrol
    match:class = (.*org.pulseaudio.pavucontrol.*)
    float = true
    center = true
    pin = true
    size = 700 600
}

# Waypaper
windowrule {
    name = waypaper
    match:class = (.*waypaper.*)
  # size = 50 969
  move = 88 20
    float = true
    center = false
    pin = false
  opacity = 1.0 override 1.0 override
}

# Newelle
windowrule {
    name = newelle
    match:class = (io.github.qwersyk.Newelle)
    float = true
    center = true
    pin = true
    size = 1000 700
}

# ML4W Sidebar
windowrule {
    name = ml4w-sidebar
    match:class = (com.ml4w.sidebar)
    float = true
    move = monitor_w-window_w-18 91
    pin = true
    size = 400 660
}

# Blueman Manager
windowrule {
    name = blueman-manager
    match:class = (blueman-manager)
    float = true
    center = true
    size = 800 600
}

# nwg-look
windowrule {
    name = nwg-look
    match:class = (nwg-look)
    float = true
    center = true
    size = 700 600
}

# nwg-displays
windowrule {
    name = nwg-displays
    match:class = (nwg-displays)
    float = true
    center = true
    size = 900 600
}

# System Mission Center
windowrule {
    name = missioncenter
    match:class = (io.missioncenter.MissionCenter)
    float = true
    center = true
    size = 900 600
}

# Hyprland Share Picker
windowrule {
    name = hyprland-share-picker
    match:class = (hyprland-share-picker)
    float = true
    pin = true
    center = true
    size = 600 400
}

# nm-connection-editor
windowrule {
    name = nm-connection-editor
    match:class = (nm-connection-editor)
    float = true
    center = true
    size = 800 700
}

# General floating
windowrule {
    name = dotfiles-floating
    match:class = (dotfiles-floating)
    float = true
    center = true
    size = 1000 700
}

# Dotfiles Sidepad
windowrule {
    name = dotfiles-sidepad
    match:class = (dotfiles-sidepad)
    float = true
    pin = true
    center = true
    size = 1000 700
}

windowrule {
  name = float-windows
  float = on
  center = on
  match:title = ^(About Mozilla.*|About Zen Browser|Junction)$
}

windowrule {
  name = DesktopEditors
  center = on
  match:class = DesktopEditors
}

windowrule {
  name = mini-calendar-and-clocks
  float = on
  size = 360 600
  move = 1536 60
  pin = on
  match:class = org.gnome.Calendar|org.gnome.clocks
}

windowrule {
  name = gnome-calculator
  float = on
  size = 360 620
  move = 1536 60
  pin = on
  match:class = org.gnome.Calculator
}

windowrule {
  name = megasync
  float = on
  center = on
  # size = 360 560
  # move = 1520 65
  match:class = nz.co.mega.megasync
}

windowrule {
  name = opaque-windows-match-title
  opacity = 1.0 override 1.0 override
  match:title = .* - YouTube.*|^(Mozilla Firefox)$|^(New Tab — Mozilla Firefox)$|^(YouTube — Mozilla Firefox)$|.*\s-\sS\d+\s-\sE\d+\s[-—]\s.*|.* — Coding — Mozilla Firefox|.* — Work — Mozilla Firefox
}

windowrule {
  name = opacity-windows-match-class
  opacity = 1.0 override 1.0 override
  match:class = org.gnome.Loupe|mpv|freetube|ente|com.github.PintaProject.Pinta|Waydroid|com.github.johnfactotum.Foliate|calibre-ebook-viewer|imv|^waydroid.*|io.gitlab.news_flash.NewsFlash|ONLYOFFICE
}

windowrule {
  name = trakt-web-app
  size = (monitor_w*0.7) (monitor_h*0.7)
  float = on
  match:title = ^(Trakt)$
}

windowrule {
  name = waydroid
  size = 1550 872
  float = on
  center = on
  match:class = Waydroid
}

windowrule {
  name = picture-in-picture
  opacity = 1.0 override 1.0 override
  float = on
  pin = on
  move = 1268 72
  size = 624 351
  match:title = ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
}

windowrule {
    name = wihotspot
    float = on
    center = on
    size = 900 600
    match:class = wihotspot
}

windowrule {
  name = file-pickers
  float = on
  center = on
  size = 800 600
  match:title = ^(Open.*|Save.*)
}

# windowrule {
#     name = firefox-coding-profile
#
#   }

# Wayclick
windowrule {
    name = dusky_wayclick
    match:class = ^(dusky_wayclick\.sh)$
    float = on
    size = 831 572
}

windowrule {
    name = dusky_tui_wayclick
    match:class = ^(dusky_tui_wayclick\.sh)$
    float = on
    size = 780 510
}

windowrule {
    name = wayclick_soundpacks_download
    match:class = ^(wayclick_soundpacks_download\.sh)$
    float = on
    size = 580 810
}

# -----------------------------------------------------
# Layer Rules
# -----------------------------------------------------

# SwayNC
layerrule = blur on, match:namespace swaync-control-center
layerrule = blur on, match:namespace swaync-notification-window
layerrule = ignore_alpha 0.5, match:namespace swaync-control-center
layerrule = ignore_alpha 0.5, match:namespace swaync-notification-window
layerrule = dim_around on, match:namespace swaync-control-center
layerrule = dim_around on, match:namespace swaync-notification-window

# Rofi
layerrule = blur on, match:namespace rofi
layerrule = dim_around on, match:namespace rofi
layerrule = ignore_alpha 0.0, match:namespace rofi
layerrule = no_anim on, match:namespace rofi

