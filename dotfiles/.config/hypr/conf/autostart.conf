exec-once = awww-daemon 
exec-once = ~/.config/hyprland-dotfiles/scripts/listeners.sh --startall
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = ~/.config/hyprland-dotfiles/scripts/wallpaper/wallpaper-restore.sh
exec-once = swaync
exec-once = ~/.config/hypr/scripts/gtk.sh
exec-once = hypridle
exec-once = wl-paste --watch cliphist store
exec-once = ~/.config/hypr/scripts/cleanup.sh
exec-once = hyprctl setcursor Bibata-Modern-Ice 24
exec-once = sleep 30; megasync
exec-once = /usr/lib/kdeconnectd&!
exec-once = /usr/bin/kdeconnect-indicator&!
exec-once = blueman-applet
exec-once = nm-applet --indicator
exec-once = awatcher
exec-once = sleep 30; aw-notify start
exec-once = walker --gapplication-service
exec-once = sleep 30; safeeyes
exec-once = hyprsunset
exec-once = syncthing serve --no-browser --logfile=default
exec-once = docker start bgutil-provider
exec-once = superproductivity
exec-once = swayosd-server
exec-once = hyprpm reload
exec-once = gnome-keyring-daemon --start
exec-once = udiskie --smart-tray &
exec-once = cachy-update --tray
exec-once = bash ~/.config/hyprland-dotfiles/scripts/safeeyes-media-afk.sh
exec-once = elephant
exec-once = /usr/local/libexec/file_manager_dbus
exec-once = env GDK_BACKEND=x11 thunderbird

exec = hyprshade on vibrance

