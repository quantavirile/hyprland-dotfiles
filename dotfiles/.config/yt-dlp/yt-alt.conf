# Format sorting: prefer h264 video, then resolution, then m4a audio
-S vcodec:h264,res,fps,acodec:m4a

# Enable fetching EJS scripts from GitHub for YouTube JS challenges
--remote-components ejs:github

# Download up to 5 fragments concurrently for faster downloads
--concurrent-fragments 5

# Track downloaded videos to avoid re-downloading
--download-archive ~/.config/yt-dlp/archive.txt

# Only download the requested video, not the entire playlist
--no-playlist

# Remove all sponsor segments (sponsor, intro, outro, etc.)
--sponsorblock-remove all

# Embed chapters into the downloaded video file
--embed-chapters

# Save under Videos/YouTube directory in your home directory
-o "~/Videos/YouTube/%(channel)s/%(title)s.%(ext)s"
